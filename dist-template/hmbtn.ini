# Harvest Moon: Back to Nature - native port configuration
# Lines starting with # or ; are comments. Remove the # in front of an option to change it.

[general]
# Your own copy of the game: a disc image (.cue or .bin) or a HarvestMoonBTN.pak data pack
# made from it. When not set (or not found), the game uses HarvestMoonBTN.pak next to the
# executable if there is one, otherwise the first .cue/.bin in the "disc" folder.
#disc = C:\Games\Harvest Moon - Back to Nature.cue

# Folder for the memory card file (card1.mcd, standard 128 KB raw format that DuckStation,
# ePSXe, etc. also use - you can copy an existing save card here).
#savedir = saves

[video]
# Initial window size as a multiple of 320x240.
scale = 3
# Internal rendering resolution: 1 = original 320x240. 2, 3 or 4 draws the 3D scenes at
# 640x480, 960x720 or 1280x960 for smoother edges (textures stay as they are); needs more CPU.
upscale = 1
# Threads that draw the 3D at upscale 2 or more, each a share of the picture's rows (the picture
# is the same): auto = one per processor thread but the game's, up to 4; 0 = the game's thread alone.
#drawthreads = auto
# 1 = precise 3D vertex positions (PGXP): no wobbling polygons. Needs upscale 2 or more.
pgxp = 0
# 1 = close the thin cracks PGXP opens where models meet (ground tiles, door frames, fences on
# the ground): there the picture shows what the console shows. 0 = leave them open, which is
# faster (about 1 ms a frame at upscale 4). Needs pgxp = 1.
crackfix = 1
# 1 = perspective-correct textures: no warping on large polygons. Needs pgxp = 1.
perspective = 0
# Widescreen: off, 16:9, 16:10 or 21:9. The 3D view gets wider (more of the farm and town
# on screen); other screens without 3D (videos, the map) stay 4:3. With upscale 2 or more,
# 2D objects and people keep their shape, the clock and dialogue boxes keep their 4:3 shape
# in the middle of the screen (sharpest with upscale 4), and the title screen and the menus
# fill the screen with their background; without, they are stretched or 4:3.
widescreen = off
# 1 = in-between pictures: the camera and the 3D scenery move every VBlank (60 times a second)
# instead of every other one. The game still runs at 30 frames a second, so people, animals
# and animations move as before. Needs pgxp = 1 and draws on 3 extra CPU threads; where the
# computer can't keep up (e.g. upscale 4 by the waterfall) it shows 30 pictures a second
# instead of slowing the game down. F9 switches it on and off while playing.
interp = 0
# Texture packs (2D sprites: people, animals, field objects, text, HUD; not the 3D world):
# 1 = draw them with the PNG images in the "textures" folder next to the game, named after the
# texture they replace. dumptextures = 1 writes each such texture the game shows to
# textures/dump, to draw them anew.
# Both need upscale 2 or more. See docs/GRAPHICS.md.
texturepack = 0
dumptextures = 0
# 1 = start in fullscreen (F11 or Alt+Enter toggles at any time).
fullscreen = 0
# How the picture is scaled to the window or screen:
#   sharp-bilinear  sharp pixels that stay even at any size (no shimmer when scrolling)
#   sharp           plain nearest pixel: uneven pixels unless the size is an exact multiple
#   smooth          bilinear, soft
scaling = sharp-bilinear
# 1 = 4:3 picture like a CRT TV, 0 = square pixels.
aspect43 = 1

[behaviour]
# 1 = allow holding Tab to fast-forward. 0 = disabled.
fastforward = 1
# Shorter loading pauses: the disc reads data this many times faster (music streaming is
# unaffected). 0 = original timing, 1 = 4x, or a number from 2 up (e.g. 8).
fastcd = 0
# 1 = record every session (the button presses, and a copy of the memory card at the start)
# to the "recordings" folder, so a problem can be replayed exactly. Small files.
record = 0
# 1 = saving and loading use MEMORY CARD slot 1 directly. 0 = ask for the slot every time.
autoslot = 1
# 1 = no waiting while the memory card is searched, loaded or saved (runs at full speed). 0 = original.
fastcard = 1
# 1 = menu and message windows open and close at once, fades to/from black (doors too) are
#     4x shorter. 0 = original.
quickui = 1
# 1 = the game runs at full speed while "Now Loading" or the black screen between places is shown
#     (the music waits meanwhile, so it does not jump ahead).
fastload = 1
# 1 = hold START during a cutscene to run it at full speed; it stops at each dialogue (choices).
skipscenes = 1
# Characters the dialogue types at a time: 1 = original speed, 2-16 = faster.
textspeed = 3
# CPU speed in percent (100 = the console). Above 100 the game no longer slows down when
# there is a lot going on (e.g. running around the farm while switching tools). 100-400.
overclock = 200
# 1 = R1 / R2 do nothing when there is no tool / item to switch to, so they no longer stop
#     the player for a moment (e.g. while running with an empty rucksack). 0 = original.
emptybag = 1

[keyboard]
# Comma-separated key names (SDL names, e.g. Up, X, Space, Return, Left Shift, Keypad 8).
#key_up       = Up
#key_down     = Down
#key_left     = Left
#key_right    = Right
#key_cross    = X,Space,K
#key_circle   = Z,L
#key_square   = S,J
#key_triangle = A,I
#key_l1       = Q
#key_r1       = W
#key_l2       = 1
#key_r2       = 2
#key_start    = Return
#key_select   = Right Shift,Backspace

[controller]
# Xbox / XInput controller buttons (SDL names): a b x y back start guide leftshoulder
# rightshoulder leftstick rightstick dpup dpdown dpleft dpright lefttrigger righttrigger
#pad_cross    = a
#pad_circle   = b
#pad_square   = x
#pad_triangle = y
#pad_l1       = leftshoulder
#pad_r1       = rightshoulder
#pad_l2       = lefttrigger
#pad_r2       = righttrigger
#pad_start    = start
#pad_select   = back
#pad_up       = dpup
#pad_down     = dpdown
#pad_left     = dpleft
#pad_right    = dpright
# 1 = the left analog stick also works as the D-pad.
stick_as_dpad = 1

[launcher]
# The launcher's language: en, pt or es (the flags in its header set it). Not set: the system's.
#language = en
